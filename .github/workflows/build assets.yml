name: Generate Rebound 2100 Master Base Models

on:
  workflow_dispatch: # Allows you to trigger it with one click!

jobs:
  build-all-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Headless Blender 4.1 & System Libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libxi6 libxrender1 libxfixes3 libxkbcommon0 zip
          wget -q https://download.blender.org/release/Blender4.1/blender-4.1.1-linux-x64.tar.xz
          tar -xf blender-4.1.1-linux-x64.tar.xz
          echo "$GITHUB_WORKSPACE/blender-4.1.1-linux-x64" >> $GITHUB_PATH

      - name: Run Blender Headless Master Batch Generator
        run: |
          mkdir -p output_models
          $GITHUB_WORKSPACE/blender-4.1.1-linux-x64/blender -b -P generate_all_2100_models.py

      - name: Verify & Zip Generated 2100 Models
        run: |
          echo "🔍 Auditing generated model count:"
          file_count=$(find output_models -type f -name "*.glb" | wc -l)
          echo "Total .glb models generated: $file_count"
          if [ "$file_count" -ne 2100 ]; then
            echo "❌ ERROR: Model count mismatch! Expected 2100, got $file_count"
            exit 1
          fi
          cd output_models
          zip -r ../Rebound_2100_Base_Models.zip .

      - name: Upload Models as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rebound_2100_Base_Models
          path: Rebound_2100_Base_Models.zip
