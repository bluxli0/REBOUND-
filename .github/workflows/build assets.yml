name: Generate Rebound 452 Base Models

on:
  workflow_dispatch: # Allows you to click a button to start it!

jobs:
  build-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Headless Blender 4.1
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libxi6 libxrender1 libxfixes3
          wget -q https://download.blender.org/release/Blender4.1/blender-4.1.1-linux-x64.tar.xz
          tar -xf blender-4.1.1-linux-x64.tar.xz
          echo "$GITHUB_WORKSPACE/blender-4.1.1-linux-x64" >> $GITHUB_PATH

      - name: Run Blender Headless Batch Generator
        run: |
          mkdir -p output_models
          blender -b -P generate_all_452_models.py

      - name: Zip Exported 452 Models
        run: |
          cd output_models
          zip -r ../Rebound_452_Base_Models.zip assets/

      - name: Upload Models as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rebound_452_Base_Models
          path: Rebound_452_Base_Models.zip
